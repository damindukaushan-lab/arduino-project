<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arduino Project</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f8ff;--card:#fff;--text:#0f1b33;--muted:#5a6a88;--blue:#1d6bff;--blue2:#00b4ff;--dark:#0a1226;--dark2:#111d3a;--line:#dbe5f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1326;--card:#132040;--text:#eaf1ff;--muted:#9fb0d0;--line:#22335c}}
:root[data-theme="dark"]{--bg:#0b1326;--card:#132040;--text:#eaf1ff;--muted:#9fb0d0;--line:#22335c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--dark);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;font-size:1.15rem;display:flex;gap:8px;align-items:center}
.logo b{background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:8px;padding:2px 8px}
nav{display:flex;gap:4px}
nav a{padding:8px 12px;border-radius:8px;font-size:.92rem;color:#c9d7f5}
nav a:hover,nav a.on{background:var(--blue);color:#fff}
#burger{display:none;background:none;border:1px solid #2c3f70;color:#fff;border-radius:8px;padding:6px 12px;font-size:1.1rem}
@media(max-width:820px){#burger{display:block}nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--dark2);flex-direction:column;padding:10px 18px}nav.open{display:flex}}
.hero{background:radial-gradient(circle at 80% 20%,#1d4fd8 0,transparent 45%),var(--dark);color:#fff;padding:64px 0}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.15;margin:0 0 14px}
.hero h1 span{color:var(--blue2)}
.hero p{color:#c3d1f0;max-width:560px;font-size:1.05rem}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;margin:4px 6px 4px 0}
.btn.alt{background:transparent;border:1.5px solid var(--blue);color:var(--blue)}
.hero .btn.alt{color:#fff;border-color:#5b7bd0}
section.pad{padding:48px 0}
.dark{background:var(--dark2);color:#eaf1ff}
.dark p{color:#b5c5e6}
h2{font-size:1.7rem;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 26px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.dark .card{background:#16264d;border-color:#26396b}
.card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:1.1rem}
.img{height:150px;display:grid;place-items:center;font-size:3.4rem;background:linear-gradient(135deg,#0d2b78,#1d6bff 60%,#00b4ff);position:relative}
.img small{position:absolute;bottom:8px;right:10px;font-size:.68rem;color:#dbe8ff;opacity:.8}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;background:rgba(29,107,255,.12);color:var(--blue);padding:2px 9px;border-radius:99px}
.dark .tag{color:#7cc4ff}
.row{margin-top:auto}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;padding:10px 12px 10px 52px;position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.steps li:before{content:counter(s);position:absolute;left:12px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
pre{background:#070d1e;color:#d6e4ff;padding:14px;border-radius:12px;overflow-x:auto;font-size:.82rem;line-height:1.5;margin:8px 0;border:1px solid #1e2f5c}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.copy{font-size:.8rem;padding:5px 12px;margin:0}
.two{display:grid;gap:22px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.comp{font-size:2rem}
footer{background:var(--dark);color:#9fb0d0;text-align:center;padding:26px 18px;font-size:.9rem}
.stat{text-align:center}.stat b{display:block;font-size:2rem;color:var(--blue2)}
</style>
</head>
<body>
<header><div class="wrap bar">
<a href="#/" class="logo"><b>⚡</b> Arduino Project</a>
<button id="burger" aria-label="Menu">☰</button>
<nav id="nav">
<a href="#/" data-p="home">Home</a><a href="#/projects" data-p="projects">Projects</a>
<a href="#/details" data-p="details">Details</a><a href="#/components" data-p="components">Components</a>
<a href="#/codes" data-p="codes">Codes</a><a href="#/about" data-p="about">About</a>
</nav></div></header>
<main id="app"></main>
<footer>© Arduino Project · Free for school students · Always ask a teacher before wiring mains power.</footer>

<script>
var P=[
{id:"railway",name:"Smart Railway Gate",icon:"🚂",level:"Beginner",
desc:"A gate that closes automatically when a train comes.",
comps:["Arduino Uno","IR sensor x2","Servo motor","Buzzer","LEDs (red/green)"],
how:["An IR sensor before the crossing detects the approaching train.","Arduino closes the gate with the servo, turns the red LED on and sounds the buzzer.","A second IR sensor after the crossing detects the train has left.","Arduino opens the gate and turns the green LED on."],
code:"#include <Servo.h>\nServo gate;\nconst int irIn=2, irOut=3, buzzer=8, red=5, green=6;\n\nvoid setup(){\n  gate.attach(9);\n  pinMode(irIn,INPUT); pinMode(irOut,INPUT);\n  pinMode(buzzer,OUTPUT); pinMode(red,OUTPUT); pinMode(green,OUTPUT);\n  gate.write(90);            // gate open\n  digitalWrite(green,HIGH);\n}\n\nvoid loop(){\n  if(digitalRead(irIn)==LOW){      // train arriving\n    gate.write(0);                 // close gate\n    digitalWrite(green,LOW);\n    digitalWrite(red,HIGH);\n    tone(buzzer,1000);\n  }\n  if(digitalRead(irOut)==LOW){     // train left\n    gate.write(90);                // open gate\n    digitalWrite(red,LOW);\n    digitalWrite(green,HIGH);\n    noTone(buzzer);\n  }\n}"},
{id:"chilli",name:"Chilli Color Sorting Machine",icon:"🌶️",level:"Advanced",
desc:"Sorts red (ripe) chillies from green (unripe) ones using a color sensor.",
comps:["Arduino Uno","TCS3200 color sensor","2 x Servo motors","Conveyor / slide","Power supply 5V"],
how:["A chilli slides under the TCS3200 color sensor.","The sensor measures red and green light values.","If red is higher, Arduino turns the sorting servo to the ripe bin.","If green is higher, the servo turns to the unripe bin."],
code:"#include <Servo.h>\nServo sorter;\nconst int S0=4,S1=5,S2=6,S3=7,OUT=8;\n\nint readColor(bool red){\n  digitalWrite(S2, red?LOW:HIGH);\n  digitalWrite(S3, LOW);\n  return pulseIn(OUT,LOW);   // lower = stronger color\n}\n\nvoid setup(){\n  pinMode(S0,OUTPUT); pinMode(S1,OUTPUT);\n  pinMode(S2,OUTPUT); pinMode(S3,OUTPUT);\n  pinMode(OUT,INPUT);\n  digitalWrite(S0,HIGH); digitalWrite(S1,LOW); // 20% scaling\n  sorter.attach(9);\n}\n\nvoid loop(){\n  int r=readColor(true);\n  int g=readColor(false);\n  if(r<g) sorter.write(150);   // red chilli\n  else    sorter.write(30);    // green chilli\n  delay(800);\n}"},
{id:"robot",name:"Obstacle Avoiding Robot",icon:"🤖",level:"Beginner",
desc:"A robot car that drives around and turns away from obstacles.",
comps:["Arduino Uno","HC-SR04 ultrasonic sensor","L298N motor driver","2 DC motors + wheels","Battery pack"],
how:["The ultrasonic sensor sends a sound pulse and measures the echo.","Arduino turns the echo time into distance in cm.","If the distance is more than 20 cm, the robot moves forward.","If it is 20 cm or less, the robot stops, then turns."],
code:"const int trig=10, echo=11;\nconst int in1=2,in2=3,in3=4,in4=5;\n\nlong distance(){\n  digitalWrite(trig,LOW); delayMicroseconds(2);\n  digitalWrite(trig,HIGH); delayMicroseconds(10);\n  digitalWrite(trig,LOW);\n  return pulseIn(echo,HIGH)*0.034/2;   // cm\n}\n\nvoid setup(){\n  pinMode(trig,OUTPUT); pinMode(echo,INPUT);\n  for(int p=2;p<=5;p++) pinMode(p,OUTPUT);\n}\n\nvoid loop(){\n  if(distance()>20){        // forward\n    digitalWrite(in1,HIGH); digitalWrite(in2,LOW);\n    digitalWrite(in3,HIGH); digitalWrite(in4,LOW);\n  } else {                  // turn right\n    digitalWrite(in1,HIGH); digitalWrite(in2,LOW);\n    digitalWrite(in3,LOW);  digitalWrite(in4,HIGH);\n    delay(500);\n  }\n}"},
{id:"dustbin",name:"Smart Dustbin",icon:"🗑️",level:"Beginner",
desc:"A touch-free dustbin whose lid opens when you come close.",
comps:["Arduino Uno","HC-SR04 ultrasonic sensor","Servo motor","Small dustbin","Jumper wires"],
how:["The ultrasonic sensor is fixed on the front of the bin.","When a hand or person is closer than 25 cm, Arduino opens the lid with the servo.","The lid stays open for 3 seconds.","Then the servo closes the lid again."],
code:"#include <Servo.h>\nServo lid;\nconst int trig=6, echo=7;\n\nlong distance(){\n  digitalWrite(trig,LOW); delayMicroseconds(2);\n  digitalWrite(trig,HIGH); delayMicroseconds(10);\n  digitalWrite(trig,LOW);\n  return pulseIn(echo,HIGH)*0.034/2;\n}\n\nvoid setup(){\n  pinMode(trig,OUTPUT); pinMode(echo,INPUT);\n  lid.attach(9);\n  lid.write(0);              // closed\n}\n\nvoid loop(){\n  if(distance()<25){\n    lid.write(90);           // open\n    delay(3000);\n    lid.write(0);            // close\n  }\n  delay(100);\n}"},
{id:"soil",name:"Soil Moisture Project",icon:"🌱",level:"Beginner",
desc:"Waters a plant automatically when the soil becomes dry.",
comps:["Arduino Uno","Soil moisture sensor","Relay module","Mini water pump","LED"],
how:["The sensor is pushed into the soil and gives an analog value.","Dry soil gives a high value, wet soil gives a low value.","When the value is above 600 (dry), Arduino turns the pump on through the relay.","When the soil is wet again, the pump turns off."],
code:"const int sensor=A0, relay=7, led=13;\n\nvoid setup(){\n  Serial.begin(9600);\n  pinMode(relay,OUTPUT); pinMode(led,OUTPUT);\n  digitalWrite(relay,HIGH);   // pump off (active-low relay)\n}\n\nvoid loop(){\n  int value=analogRead(sensor);\n  Serial.println(value);\n  if(value>600){              // dry soil\n    digitalWrite(relay,LOW);  // pump ON\n    digitalWrite(led,HIGH);\n  } else {\n    digitalWrite(relay,HIGH); // pump OFF\n    digitalWrite(led,LOW);\n  }\n  delay(1000);\n}"}
];
var C=[["🔲","Arduino Uno","The brain. It reads sensors and controls outputs."],["📡","IR Sensor","Detects objects or a train using infrared light."],["🔊","Ultrasonic HC-SR04","Measures distance using sound echoes."],["⚙️","Servo Motor","Turns to an exact angle. Great for gates and lids."],["🚗","DC Motor + L298N","Spins wheels. The L298N driver controls speed and direction."],["🎨","TCS3200 Color Sensor","Reads red, green and blue light values."],["💧","Soil Moisture Sensor","Measures how wet the soil is."],["🔌","Relay Module","A switch Arduino uses to control a pump safely."],["💡","LED & Buzzer","Show light and make sound to give feedback."],["🧵","Breadboard & Wires","Connect parts without soldering."]];
var app=document.getElementById("app");
function h(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function card(p){return '<div class="card"><div class="img">'+p.icon+'<small>Add project photo here</small></div><div class="body"><h3>'+p.name+'</h3><div class="tags"><span class="tag">'+p.level+'</span></div><p style="margin:0;color:var(--muted);font-size:.92rem">'+p.desc+'</p><div><b style="font-size:.85rem">Components</b><div class="tags" style="margin-top:4px">'+p.comps.map(function(c){return '<span class="tag">'+c+'</span>'}).join("")+'</div></div><div><b style="font-size:.85rem">How it works</b><p style="margin:2px 0 0;font-size:.88rem;color:var(--muted)">'+p.how[0]+'</p></div><div class="row"><a class="btn" href="#/details/'+p.id+'">View Project</a><a class="btn alt" href="#/codes/'+p.id+'">Arduino Code</a></div></div></div>'}
function codeBlock(p){return '<div class="head"><h3 style="margin:0">'+p.name+'</h3><button class="btn copy" data-c="'+p.id+'">Copy Code</button></div><pre>'+h(p.code)+'</pre>'}
var pages={
home:function(){return '<section class="hero"><div class="wrap"><h1>Learn Arduino by <span>building real projects</span></h1><p>A free place for school students to learn electronics, understand code and showcase their Arduino projects.</p><a class="btn" href="#/projects">View Projects</a><a class="btn alt" href="#/components">Learn More</a></div></section>'+
'<section class="pad"><div class="wrap"><h2>Why students like it</h2><p class="sub">Simple steps, clear code, real results.</p><div class="grid"><div class="card"><div class="body"><h3>🧠 Easy to understand</h3><p style="margin:0;color:var(--muted)">Every project explains parts and steps in plain words.</p></div></div><div class="card"><div class="body"><h3>💻 Ready code</h3><p style="margin:0;color:var(--muted)">Copy the Arduino code and upload it in seconds.</p></div></div><div class="card"><div class="body"><h3>🏆 Show your work</h3><p style="margin:0;color:var(--muted)">Use it as a portfolio for school exhibitions.</p></div></div></div></div></section>'+
'<section class="pad dark"><div class="wrap"><div class="grid"><div class="stat"><b>5</b>Projects</div><div class="stat"><b>10</b>Components</div><div class="stat"><b>100%</b>Free</div></div></div></section>'+
'<section class="pad"><div class="wrap"><h2>Featured projects</h2><p class="sub">Start with a beginner project.</p><div class="grid">'+[P[2],P[3],P[4]].map(card).join("")+'</div></div></section>'},
projects:function(){return '<section class="hero" style="padding:38px 0"><div class="wrap"><h1 style="font-size:2.2rem">Arduino <span>Projects</span></h1><p>Pick a project, read how it works, then build it.</p></div></section><section class="pad"><div class="wrap"><div class="grid">'+P.map(card).join("")+'</div></div></section>'},
details:function(id){var p=P.filter(function(x){return x.id==id})[0];
if(!p)return '<section class="pad"><div class="wrap"><h2>Project Details</h2><p class="sub">Choose a project to see full details.</p><div class="grid">'+P.map(function(q){return '<a class="card" href="#/details/'+q.id+'"><div class="img">'+q.icon+'</div><div class="body"><h3>'+q.name+'</h3><span class="btn" style="text-align:center">View Project</span></div></a>'}).join("")+'</div></div></section>';
return '<section class="hero" style="padding:38px 0"><div class="wrap"><a href="#/projects" style="color:#7cc4ff">← All projects</a><h1 style="font-size:2.2rem;margin-top:8px">'+p.icon+' '+p.name+'</h1><p>'+p.desc+'</p></div></section><section class="pad"><div class="wrap two"><div><div class="img" style="border-radius:16px;height:220px">'+p.icon+'<small>Add project photo here</small></div><h2 style="margin-top:22px">Components</h2><div class="tags">'+p.comps.map(function(c){return '<span class="tag" style="font-size:.9rem;padding:5px 12px">'+c+'</span>'}).join("")+'</div></div><div><h2>How it works</h2><ol class="steps">'+p.how.map(function(s){return '<li>'+s+'</li>'}).join("")+'</ol></div></div></section><section class="pad dark"><div class="wrap"><h2>Arduino Code</h2><p>Open the Arduino IDE, paste this code and press Upload.</p>'+codeBlock(p)+'</div></section>'},
components:function(){return '<section class="pad"><div class="wrap"><h2>Arduino Components</h2><p class="sub">The parts you will meet in these projects.</p><div class="grid">'+C.map(function(c){return '<div class="card"><div class="body"><div class="comp">'+c[0]+'</div><h3>'+c[1]+'</h3><p style="margin:0;color:var(--muted)">'+c[2]+'</p></div></div>'}).join("")+'</div></div></section>'},
codes:function(id){var list=id?P.filter(function(x){return x.id==id}):P;return '<section class="pad dark" style="min-height:70vh"><div class="wrap"><h2>Arduino Codes</h2><p>Copy a sketch, paste it in the Arduino IDE and upload. Check pin numbers against your wiring.</p>'+list.map(function(p){return '<div style="margin-bottom:28px">'+codeBlock(p)+'</div>'}).join("")+(id?'<a class="btn" href="#/codes">All Codes</a>':'')+'</div></section>'},
about:function(){return '<section class="pad"><div class="wrap two"><div><h2>About Arduino Project</h2><p>Arduino Project is a free learning website made for school students. It shows how to build simple electronics projects step by step and how to share them with classmates and teachers.</p><p style="color:var(--muted)">Arduino is an easy open-source electronics board. You write a small program, upload it, and the board controls lights, motors and sensors.</p><a class="btn" href="#/projects">View Projects</a></div><div class="card"><div class="body"><h3>Start in 4 steps</h3><ol class="steps" style="margin:0"><li>Install the Arduino IDE.</li><li>Connect the parts as shown.</li><li>Paste and upload the code.</li><li>Test, improve and show your project.</li></ol></div></div></div></section>'}};
function route(){var r=(location.hash||"#/").replace("#/","").split("/");var pg=r[0]||"home";if(!pages[pg])pg="home";app.innerHTML=pages[pg](r[1]);document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.dataset.p==pg)});document.getElementById("nav").classList.remove("open");window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.getElementById("burger").onclick=function(){document.getElementById("nav").classList.toggle("open")};
document.addEventListener("click",function(e){var b=e.target.closest("[data-c]");if(!b)return;var p=P.filter(function(x){return x.id==b.dataset.c})[0];try{navigator.clipboard.writeText(p.code);b.textContent="Copied!"}catch(x){b.textContent="Select & copy"}setTimeout(function(){b.textContent="Copy Code"},1500)});
route();
</script>
</body>
</html>
